$kind: http-request
url: "{{api_base_url}}/health"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Missing credential returns 401', function () { pm.response.to.have.status(401); });
      pm.test('Error is JSON', function () { pm.response.to.be.json; });
      pm.test('No stack trace or bearer material is exposed', function () { const body = pm.response.text(); pm.expect(body).not.to.match(/stacktrace|exception\s*:|bearer\s+[a-z0-9._-]+/i); });
    language: text/javascript
order: 1000
