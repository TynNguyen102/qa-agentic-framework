$kind: http-request
url: "{{api_base_url}}/connector-types"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{access_token}}
  X-Tenant-Id: "{{tenant_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Connector catalog returns 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is a JSON envelope', function () { pm.response.to.be.json; pm.expect(pm.response.json()).to.be.an('object'); });
    language: text/javascript
order: 3000
