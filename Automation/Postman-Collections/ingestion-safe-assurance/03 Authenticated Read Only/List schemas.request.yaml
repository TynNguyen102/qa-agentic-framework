$kind: http-request
url: "{{api_base_url}}/schemas"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{access_token}}
  X-Tenant-Id: "{{tenant_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Schemas endpoint returns 200', function () { pm.response.to.have.status(200); });
      pm.test('Response is JSON', function () { pm.response.to.be.json; });
    language: text/javascript
order: 5000
