$kind: http-request
description: Runs once per row in data/unauth-get-inventory.json and proves the edge rejects an unauthenticated GET before resource lookup or input processing.
url: "{{gateway_base_url}}{{path_and_query}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const operationId = pm.iterationData.get('operation_id');
      const operationPath = pm.iterationData.get('operation_path');
      const label = `${operationId} GET ${operationPath}`;
      pm.test(`${label}: missing credential returns 401`, function () { pm.response.to.have.status(401); });
      pm.test(`${label}: error is JSON`, function () { pm.response.to.be.json; });
      pm.test(`${label}: no stack trace or bearer material is exposed`, function () {
        const body = pm.response.text();
        pm.expect(body).not.to.match(/stacktrace|exception\s*:|bearer\s+[a-z0-9._-]{16,}/i);
      });
      const payload = pm.response.json();
      console.log(JSON.stringify({ operationId, operationPath, status: pm.response.code, responseKeys: payload && typeof payload === 'object' ? Object.keys(payload).sort() : [] }));
    language: text/javascript
order: 1000
