schema_version: 1
status: DRAFT
updated_at: "2026-09-16"
purpose: >
  Đăng bạ phiên bản skill (gap P0 #10 — trước đây 0/51 skill có trường version).
  Mục đích không phải đánh số cho đẹp, mà để trả lời được: "kết quả này sinh bởi skill phiên bản nào,
  và từ đó tới nay skill có đổi không". Thiếu cái này thì không truy được vì sao một verdict cũ khác
  verdict hôm nay.
related:
  - "Config/QA-Agent/schemas/skill-io.schema.yaml"
  - "governance/LEARNING_FEEDBACK_POLICY.md (sửa skill phải qua MR + eval)"

versioning_scheme:
  format: "MAJOR.MINOR"
  major: "Đổi hành vi hoặc contract — output cũ không còn tương thích. Cần cổng G6 + chạy lại eval liên quan."
  minor: "Thêm mục, làm rõ câu chữ, sửa lỗi diễn đạt — không đổi contract."
  rule: "Sửa một skill thì TĂNG version ở đây. Không tăng = coi như chưa sửa."
  note: >
    Cố ý đặt version ở MỘT file thay vì nhét frontmatter vào 51 SKILL.md: frontmatter của skill được
    runtime đọc để routing, thêm trường lạ vào đó là rủi ro không cần thiết. Đây là backward-compatible.

# ---------------------------------------------------------------------
# Baseline 2026-09-16. Mọi skill có TRƯỚC phiên này đặt 1.0 (không truy ngược được lịch sử thật).
# Ba skill mới tạo trong phiên này cũng là 1.0 nhưng ghi rõ created_at.
# ---------------------------------------------------------------------
baseline_note: >
  41 skill đánh số + 7 support đã tồn tại trước 2026-09-16 được gán 1.0 làm mốc. Đây KHÔNG phải
  tuyên bố rằng chúng chưa từng đổi — chỉ là mốc bắt đầu đếm. Lịch sử trước đó nằm ở git log.

