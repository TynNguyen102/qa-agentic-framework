run_protocol:
  agent_type: READ_ONLY
  agent_type_note: >
    Dung agent chi-doc (vd Explore). KHONG dung general-purpose — loai do co Write/Edit/Bash,
    trong khi eval chi can doc de tra loi.
  prompt_rule: >
    Prompt phai yeu cau subagent MO TA se lam gi, KHONG thuc hien. Cam dung cau
    "tra loi nhu ban se xu ly mot prompt that" — chinh cau do da moi 4 subagent lam viec that.
    Cau thay the: "Mo ta ban SE lam gi va vi sao. KHONG tao/sua file, khong goi API, khong ghi Jira."
  side_effect_rule: >
    Sau moi luot eval, chay `git status --porcelain` va doi chieu: eval KHONG duoc de lai
    thay doi nao ngoai chinh file eval-suite.yaml va bang diem.
  why_it_matters: >
    Mot bai kiem tra de lai tac dung phu thi khong con la bai kiem tra — no la mot luot lam viec
    khong duoc duyet. Ket qua van dung, nhung quy trinh thi sai.

